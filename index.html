<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuclear Events — Global Archive</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Inter:wght@300;400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --red: #ff2a2a;
    --orange: #ff7300;
    --dim: rgba(255,255,255,0.06);
    --glass: rgba(10,12,20,0.88);
    --border: rgba(255,255,255,0.1);
    --font-mono: 'Share Tech Mono', monospace;
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  body { background:#020408; color:#fff; font-family:var(--font-body); overflow:hidden; height:100vh; width:100vw; }
  #canvas-container { position:fixed; inset:0; }
  canvas { display:block; }

  #header {
    position:fixed; top:0; left:0; right:0; padding:20px 32px;
    display:flex; align-items:center; justify-content:space-between;
    z-index:10; background:linear-gradient(to bottom,rgba(2,4,8,0.95) 0%,transparent 100%);
  }
  #title { font-family:var(--font-display); font-size:28px; letter-spacing:4px; }
  #title span { color:var(--red); }
  #stats { font-family:var(--font-mono); font-size:12px; color:rgba(255,255,255,0.4); text-align:right; line-height:1.8; }
  #stats strong { color:rgba(255,255,255,0.85); }

  #legend {
    position:fixed; top:90px; left:32px; z-index:10;
    display:flex; flex-direction:column; gap:8px;
  }
  .legend-item {
    display:flex; align-items:center; gap:10px;
    font-family:var(--font-mono); font-size:11px; color:rgba(255,255,255,0.5);
    cursor:pointer; padding:4px 10px; border-radius:4px;
    border:1px solid transparent; transition:all 0.2s;
  }
  .legend-item:hover { background:var(--dim); border-color:var(--border); }
  .legend-item.inactive { opacity:0.3; }
  .legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }

  #globe-paused-badge {
    position:fixed; top:90px; right:32px; z-index:10;
    font-family:var(--font-mono); font-size:10px; letter-spacing:2px;
    color:rgba(255,200,80,0.8); border:1px solid rgba(255,200,80,0.3);
    background:rgba(255,200,80,0.07); padding:5px 12px; border-radius:4px;
    display:none; pointer-events:none;
  }

  #timeline {
    position:fixed; bottom:0; left:0; right:0; padding:20px 32px 28px;
    background:linear-gradient(to top,rgba(2,4,8,0.98) 0%,transparent 100%);
    z-index:10;
  }
  #timeline-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  #year-display { font-family:var(--font-display); font-size:52px; line-height:1; letter-spacing:2px; min-width:120px; }
  #timeline-controls { display:flex; align-items:center; gap:12px; }
  #play-btn {
    width:40px; height:40px; border-radius:50%;
    border:1px solid var(--border); background:var(--dim);
    color:#fff; font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:border-color 0.2s, background 0.2s;
  }
  #play-btn:hover { border-color:var(--red); background:rgba(255,42,42,0.15); }
  #event-count-display { font-family:var(--font-mono); font-size:12px; color:rgba(255,255,255,0.4); }
  #event-count-display strong { color:var(--red); }
  #slider-wrap { position:relative; height:32px; display:flex; align-items:center; }
  #tick-canvas { position:absolute; top:0; left:0; width:100%; height:32px; pointer-events:none; }
  #year-slider {
    position:absolute; width:100%;
    -webkit-appearance:none; appearance:none;
    height:2px; background:transparent; outline:none; cursor:pointer; z-index:2;
  }
  #year-slider::-webkit-slider-thumb {
    -webkit-appearance:none;
    width:18px; height:18px; border-radius:50%;
    background:#fff; border:2px solid var(--red); cursor:grab;
    box-shadow:0 0 12px rgba(255,42,42,0.7);
  }
  #slider-track {
    position:absolute; left:0; right:0; height:2px;
    background:rgba(255,255,255,0.1); top:50%; transform:translateY(-50%);
    border-radius:2px; overflow:hidden;
  }
  #slider-fill { height:100%; background:var(--red); border-radius:2px; }
  #year-labels { display:flex; justify-content:space-between; margin-top:8px; font-family:var(--font-mono); font-size:10px; color:rgba(255,255,255,0.25); }

  #event-card {
    position:fixed; top:50%; right:32px; transform:translateY(-50%);
    width:320px; background:var(--glass); border:1px solid var(--border);
    border-radius:12px; backdrop-filter:blur(24px);
    z-index:20; display:none; overflow:hidden; transition:width 0.3s ease;
  }
  #event-card.expanded { width:390px; }
  #card-header {
    padding:16px 18px 14px; border-bottom:1px solid var(--border);
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  }
  #card-event-name { font-family:var(--font-display); font-size:22px; letter-spacing:1px; line-height:1.2; flex:1; }
  #card-close { background:none; border:none; color:rgba(255,255,255,0.35); cursor:pointer; font-size:18px; padding:0; transition:color 0.2s; flex-shrink:0; }
  #card-close:hover { color:#fff; }
  #card-meta { padding:14px 18px; display:flex; flex-wrap:wrap; gap:8px; }
  .meta-badge { font-family:var(--font-mono); font-size:11px; padding:4px 10px; border-radius:4px; border:1px solid; }
  .badge-year { border-color:rgba(255,255,255,0.2); color:rgba(255,255,255,0.7); }
  .badge-country { border-color:rgba(0,170,255,0.4); color:#00aaff; background:rgba(0,170,255,0.08); }
  .badge-type-test { border-color:rgba(255,42,42,0.4); color:#ff6b6b; background:rgba(255,42,42,0.08); }
  .badge-type-accident { border-color:rgba(255,115,0,0.4); color:#ff9442; background:rgba(255,115,0,0.08); }
  .badge-type-combat { border-color:rgba(200,20,20,0.5); color:#ff3333; background:rgba(200,20,20,0.18); }
  .badge-yield { border-color:rgba(255,200,0,0.3); color:#ffd700; background:rgba(255,200,0,0.06); }
  #expand-btn {
    margin:0 18px 14px; display:flex; align-items:center; gap:8px;
    background:var(--dim); border:1px solid var(--border); border-radius:6px;
    color:rgba(255,255,255,0.55); font-family:var(--font-mono); font-size:11px;
    cursor:pointer; padding:8px 12px; width:calc(100% - 36px);
    transition:border-color 0.2s, color 0.2s;
  }
  #expand-btn:hover { border-color:rgba(255,255,255,0.25); color:#fff; }
  #card-details { display:none; padding:0 18px 16px; border-top:1px solid var(--border); }
  #card-details.visible { display:block; }
  #card-description { font-size:13px; color:rgba(255,255,255,0.58); line-height:1.75; margin:14px 0 16px; }
  #chat-section { border-top:1px solid var(--border); padding-top:14px; }
  #chat-label { font-family:var(--font-mono); font-size:10px; color:rgba(255,255,255,0.3); letter-spacing:2px; margin-bottom:10px; }
  #chat-messages {
    max-height:200px; overflow-y:auto;
    display:flex; flex-direction:column; gap:8px; margin-bottom:10px;
    scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.08) transparent;
  }
  .chat-msg { font-size:12px; line-height:1.65; padding:8px 10px; border-radius:6px; max-width:92%; }
  .chat-msg.user { background:rgba(255,42,42,0.1); border:1px solid rgba(255,42,42,0.2); color:rgba(255,255,255,0.88); align-self:flex-end; }
  .chat-msg.ai { background:var(--dim); border:1px solid var(--border); color:rgba(255,255,255,0.72); align-self:flex-start; }
  .chat-msg.thinking { color:rgba(255,255,255,0.25); font-style:italic; font-family:var(--font-mono); font-size:11px; border:none; background:none; padding:2px 4px; }
  #chat-input-row { display:flex; gap:6px; }
  #chat-input {
    flex:1; background:var(--dim); border:1px solid var(--border);
    border-radius:6px; color:#fff; font-family:var(--font-mono);
    font-size:11px; padding:8px 10px; outline:none; transition:border-color 0.2s;
  }
  #chat-input:focus { border-color:rgba(255,42,42,0.5); }
  #chat-input::placeholder { color:rgba(255,255,255,0.18); }
  #chat-send {
    background:rgba(255,42,42,0.12); border:1px solid rgba(255,42,42,0.3);
    border-radius:6px; color:var(--red); cursor:pointer; padding:8px 14px;
    font-size:14px; transition:background 0.2s;
  }
  #chat-send:hover { background:rgba(255,42,42,0.25); }

  #intro-hint {
    position:fixed; bottom:140px; left:50%; transform:translateX(-50%);
    font-family:var(--font-mono); font-size:12px; color:rgba(255,255,255,0.22);
    pointer-events:none; transition:opacity 1.5s; white-space:nowrap;
  }
  #loading-borders {
    position:fixed; bottom:145px; right:32px; z-index:10;
    font-family:var(--font-mono); font-size:10px; color:rgba(255,255,255,0.25);
    letter-spacing:1px;
  }
</style>
</head>
<body>
<div id="canvas-container"></div>

<div id="header">
  <div id="title">NUCLEAR <span>ARCHIVE</span></div>
  <div id="stats">
    Markers visible: <strong id="stat-visible">0</strong><br>
    Total recorded: <strong id="stat-total">0</strong>
  </div>
</div>

<div id="globe-paused-badge">⏸ GLOBE PAUSED</div>

<div id="legend">
  <div class="legend-item" data-type="test" onclick="toggleFilter('test',this)">
    <div class="legend-dot" style="background:#ff3333"></div>WEAPONS TEST
  </div>
  <div class="legend-item" data-type="accident" onclick="toggleFilter('accident',this)">
    <div class="legend-dot" style="background:#ff7300"></div>NUCLEAR ACCIDENT
  </div>
  <div class="legend-item" data-type="combat" onclick="toggleFilter('combat',this)">
    <div class="legend-dot" style="background:#cc0000"></div>COMBAT USE
  </div>
</div>

<div id="event-card">
  <div id="card-header">
    <div id="card-event-name"></div>
    <button id="card-close" onclick="closeCard()">✕</button>
  </div>
  <div id="card-meta"></div>
  <button id="expand-btn" onclick="toggleExpand()">
    <span id="expand-icon">＋</span>
    <span id="expand-label">Historical details &amp; AI assistant</span>
  </button>
  <div id="card-details">
    <p id="card-description"></p>
    <div id="chat-section">
      <div id="chat-label">NUCLEAR HISTORY AI</div>
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <input id="chat-input" type="text" placeholder="Ask about this event or nuclear history…" onkeydown="if(event.key==='Enter')sendChat()">
        <button id="chat-send" onclick="sendChat()">→</button>
      </div>
    </div>
  </div>
</div>

<div id="timeline">
  <div id="timeline-top">
    <div id="year-display">1945</div>
    <div id="timeline-controls">
      <div id="event-count-display">New this year: <strong id="this-year-count">0</strong></div>
      <button id="play-btn" onclick="togglePlay()">▶</button>
    </div>
  </div>
  <div id="slider-wrap">
    <canvas id="tick-canvas"></canvas>
    <div id="slider-track"><div id="slider-fill"></div></div>
    <input type="range" id="year-slider" min="1945" max="2023" value="1945" step="1" oninput="onSlider(this.value)">
  </div>
  <div id="year-labels">
    <span>1945</span><span>1955</span><span>1965</span><span>1975</span><span>1985</span><span>1995</span><span>2005</span><span>2015</span><span>2023</span>
  </div>
</div>

<div id="intro-hint">Drag to rotate · Scroll to zoom · Click a marker to explore</div>
<div id="loading-borders">Loading borders…</div>

<script>
// ─── DATA ─────────────────────────────────────────────────────────────────────
const EVENTS = [
  {id:1,name:"Trinity Test",year:1945,lat:33.677,lon:-106.475,country:"USA",type:"test",yield_kt:21,desc:"The world's first nuclear detonation. Part of the Manhattan Project, it took place in the New Mexico desert on July 16, 1945. The test confirmed the implosion-type plutonium device worked, paving the way for the bombing of Nagasaki. Physicist J. Robert Oppenheimer recalled: 'Now I am become Death, the destroyer of worlds.'"},
  {id:2,name:"Hiroshima — Little Boy",year:1945,lat:34.385,lon:132.455,country:"USA",type:"combat",yield_kt:15,desc:"The first use of a nuclear weapon against a civilian population. A uranium gun-type bomb was dropped on Hiroshima on August 6, 1945, killing an estimated 70,000–140,000 people immediately. Tens of thousands more died from radiation sickness in subsequent months."},
  {id:3,name:"Nagasaki — Fat Man",year:1945,lat:32.765,lon:129.863,country:"USA",type:"combat",yield_kt:21,desc:"Three days after Hiroshima, a plutonium implosion bomb was dropped on Nagasaki on August 9, 1945. Approximately 40,000–80,000 people died instantly. Japan announced surrender six days later, ending World War II. The two bombings remain the only wartime use of nuclear weapons in history."},
  {id:4,name:"Operation Crossroads — Able",year:1946,lat:11.6,lon:165.4,country:"USA",type:"test",yield_kt:23,desc:"The first post-war nuclear test, conducted at Bikini Atoll in the Pacific. Attended by military observers and journalists, it was intended to study nuclear weapon effects on warships. The indigenous Bikini Islanders had been relocated and were never able to return permanently."},
  {id:5,name:"Joe-1 — First Soviet Test",year:1949,lat:50.07,lon:78.43,country:"USSR",type:"test",yield_kt:22,desc:"The Soviet Union's first nuclear test, detonated at the Semipalatinsk Test Site in Kazakhstan. Codenamed 'Joe-1' by the West, it shocked U.S. intelligence and triggered a massive escalation of the Cold War arms race."},
  {id:6,name:"Ivy Mike — First Hydrogen Bomb",year:1952,lat:11.35,lon:162.19,country:"USA",type:"test",yield_kt:10400,desc:"The world's first thermonuclear device, detonated on Enewetak Atoll. With a yield of 10.4 megatons — 700 times more powerful than Hiroshima — it vaporized the entire island of Elugelab. The hydrogen bomb era had definitively begun."},
  {id:7,name:"Castle Bravo",year:1954,lat:11.7,lon:165.27,country:"USA",type:"test",yield_kt:15000,desc:"The most powerful US nuclear test ever, yielding 15 megatons — 2.5 times its predicted yield. Fallout spread over 7,000 square miles of ocean, contaminating the Marshall Islands and the Japanese fishing vessel Lucky Dragon No. 5. The disaster led to the 1963 Partial Test Ban Treaty."},
  {id:8,name:"UK Hurricane Test",year:1952,lat:-22.0,lon:114.0,country:"UK",type:"test",yield_kt:25,desc:"Britain became the third nuclear power with this test aboard HMS Plym off the Monte Bello Islands, Australia. The explosion sank the ship and contaminated the seabed with plutonium for decades."},
  {id:9,name:"RDS-37 — Soviet H-Bomb",year:1955,lat:50.07,lon:78.43,country:"USSR",type:"test",yield_kt:1600,desc:"The Soviet Union's first deliverable thermonuclear bomb test, yielding 1.6 megatons. The shock wave shattered windows and injured people over 100km away, including spectators watching from open bleachers."},
  {id:10,name:"Kyshtym Nuclear Disaster",year:1957,lat:55.71,lon:60.85,country:"USSR",type:"accident",yield_kt:0,desc:"The world's third worst nuclear disaster, hidden by the Soviet government for decades. A cooling failure caused a chemical explosion in a radioactive waste tank at the Mayak plutonium plant. Contamination spread across 20,000 km². Rated Level 6 on the INES scale."},
  {id:11,name:"Tsar Bomba",year:1961,lat:73.8,lon:54.5,country:"USSR",type:"test",yield_kt:50000,desc:"The largest nuclear weapon ever detonated, exploded over Novaya Zemlya. At 50 megatons — 3,800 times the Hiroshima bomb — the fireball was 8km wide. Windows broke 900km away. It remains the single most powerful man-made explosion in history."},
  {id:12,name:"Gerboise Bleue — French First Test",year:1960,lat:24.8,lon:5.05,country:"France",type:"test",yield_kt:70,desc:"France became the fourth nuclear power with a test in the Algerian Sahara. At 70 kilotons, it was four times the Hiroshima yield. Algerian civilians and French soldiers in the area received significant radiation exposure."},
  {id:13,name:"SL-1 Reactor Accident",year:1961,lat:43.65,lon:-112.87,country:"USA",type:"accident",yield_kt:0.001,desc:"A prompt criticality accident at a US Army experimental reactor in Idaho, killing three operators — the first US nuclear fatalities in a reactor accident. One operator was impaled and driven through the ceiling by a control rod ejected at enormous speed."},
  {id:14,name:"China First Nuclear Test — 596",year:1964,lat:41.18,lon:89.54,country:"China",type:"test",yield_kt:22,desc:"China became the fifth nuclear power with a test in the Lop Nor desert in Xinjiang. The test was politically significant, occurring during the Sino-Soviet split and demonstrating China's independence. Mao Zedong had previously dismissed nuclear weapons as 'paper tigers.'"},
  {id:15,name:"Palomares B-52 Crash",year:1966,lat:37.25,lon:-1.77,country:"USA",type:"accident",yield_kt:0,desc:"A B-52 carrying four hydrogen bombs collided with a refueling tanker over Palomares, Spain. Two bombs' conventional explosives detonated, scattering plutonium across farmland. Spain's tourism minister famously swam in the sea to reassure tourists during the classified cleanup."},
  {id:16,name:"India First Test — Smiling Buddha",year:1974,lat:27.08,lon:71.73,country:"India",type:"test",yield_kt:8,desc:"India's first nuclear test, officially called a 'peaceful nuclear explosion.' It shocked Pakistan and directly prompted Pakistan to accelerate its own nuclear weapons program, fundamentally altering South Asian security dynamics."},
  {id:17,name:"Three Mile Island Accident",year:1979,lat:40.15,lon:-76.73,country:"USA",type:"accident",yield_kt:0,desc:"The worst commercial nuclear accident in US history. A partial meltdown at a reactor near Harrisburg, Pennsylvania transformed US public perception of nuclear power and halted new plant construction for decades."},
  {id:18,name:"Chernobyl Disaster",year:1986,lat:51.39,lon:30.10,country:"USSR",type:"accident",yield_kt:0,desc:"The world's worst nuclear disaster. During a safety test at Reactor No. 4 in Ukraine, explosions caused a fire lasting 10 days. Radioactive material released was 400 times that of Hiroshima. 350,000 people were evacuated. The disaster is considered a factor in the collapse of the Soviet Union."},
  {id:19,name:"India Pokhran-II",year:1998,lat:27.08,lon:71.73,country:"India",type:"test",yield_kt:45,desc:"India conducted five nuclear tests in the Rajasthan desert, including a thermonuclear device. The tests triggered international sanctions and prompted Pakistan's Chagai tests two weeks later, cementing South Asia as a nuclear flashpoint."},
  {id:20,name:"Pakistan Chagai-I Tests",year:1998,lat:29.12,lon:66.39,country:"Pakistan",type:"test",yield_kt:40,desc:"Pakistan conducted six nuclear tests in the Chagai District of Balochistan, becoming the seventh confirmed nuclear power, directly responding to India's Pokhran-II tests. They cemented a nuclear standoff between two countries with unresolved territorial disputes."},
  {id:21,name:"Tokaimura Nuclear Accident",year:1999,lat:36.47,lon:140.6,country:"Japan",type:"accident",yield_kt:0,desc:"Japan's worst nuclear accident before Fukushima. Workers accidentally created a self-sustaining fission reaction by mixing too much uranium by hand. Two workers died from acute radiation syndrome and nearly 700 people were exposed to radiation."},
  {id:22,name:"North Korea First Test",year:2006,lat:41.31,lon:129.09,country:"North Korea",type:"test",yield_kt:1,desc:"North Korea announced its first nuclear test at the Punggye-ri site, becoming the ninth nuclear-armed state. The UN Security Council unanimously condemned the test. The small yield suggested limited success, but the geopolitical impact was enormous."},
  {id:23,name:"Fukushima Daiichi Disaster",year:2011,lat:37.42,lon:141.03,country:"Japan",type:"accident",yield_kt:0,desc:"A 9.0-magnitude earthquake and tsunami disabled cooling systems at Fukushima Daiichi. Three reactors melted down. Over 150,000 residents were evacuated. Rated Level 7 on INES alongside Chernobyl, it is the second worst nuclear disaster in history."},
  {id:24,name:"North Korea Hydrogen Bomb Test",year:2017,lat:41.31,lon:129.09,country:"North Korea",type:"test",yield_kt:250,desc:"North Korea's sixth and most powerful nuclear test, assessed as likely thermonuclear, yielding an estimated 250 kilotons. It triggered a 6.3-magnitude earthquake detected globally and the UN's strictest-ever sanctions on North Korea."},
  {id:25,name:"Tsar Bomba — Novaya Zemlya",year:1958,lat:73.4,lon:54.9,country:"USSR",type:"test",yield_kt:1580,desc:"Part of a long Soviet test series at Novaya Zemlya, this atmospheric test was one of dozens conducted at the remote Arctic archipelago. The site saw hundreds of Soviet nuclear tests over several decades, leaving lasting environmental contamination."},
  {id:26,name:"French Polynesia — Canopus",year:1968,lat:-22.24,lon:-138.75,country:"France",type:"test",yield_kt:2600,desc:"France's first thermonuclear test at Fangataufa Atoll, yielding 2.6 megatons. France conducted atmospheric Pacific tests until 1974 and underground tests until 1996, despite widespread international protest and documented contamination of the local islands."},
  {id:27,name:"UK Operation Totem Tests",year:1953,lat:-29.9,lon:131.0,country:"UK",type:"test",yield_kt:10,desc:"Britain conducted nuclear tests at Emu Field in South Australia without adequately informing the Australian government of the health risks. Aboriginal communities in the region were not properly evacuated. Radiation exposure became the subject of major legal action by Australian veterans."},
  {id:28,name:"Thule Air Base B-52 Crash",year:1968,lat:76.53,lon:-68.7,country:"USA",type:"accident",yield_kt:0,desc:"A B-52 crashed on sea ice near Thule Air Base, Greenland, burning the conventional explosives in four hydrogen bombs and spreading radioactive contamination. One weapon's secondary stage was never found and remains under the seabed to this day."},
];

const MIN_YEAR=1945, MAX_YEAR=2023;
let currentYear=1945, isPlaying=false, playInterval=null;
let activeFilters={test:true,accident:true,combat:true};
let selectedEvent=null, isExpanded=false, chatHistory=[];
let globePaused=false; // stops auto-rotation when card is open

// ─── THREE.JS SETUP ───────────────────────────────────────────────────────────
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.set(0,0,2.9);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setClearColor(0x000000,0);
document.getElementById('canvas-container').appendChild(renderer.domElement);

// ─── OCEAN SPHERE (vivid blue water bodies) ───────────────────────────────────
const oceanGeo=new THREE.SphereGeometry(0.998,64,64);
const oceanMat=new THREE.MeshPhongMaterial({
  color:0x0a4a8a,      // rich ocean blue
  emissive:0x041828,
  specular:0x2288cc,
  shininess:80,
});
scene.add(new THREE.Mesh(oceanGeo,oceanMat));

// ─── LAND SPHERE (sits on top of ocean, slightly smaller gaps show ocean at coasts) ──
const globeGeo=new THREE.SphereGeometry(1.0,64,64);
const globeMat=new THREE.MeshPhongMaterial({
  color:0x0e2010,      // dark earthy green for land masses
  emissive:0x060e07,
  specular:0x0a180a,
  shininess:5,
  transparent:true,
  opacity:0.97,
});
const globe=new THREE.Mesh(globeGeo,globeMat);
scene.add(globe);

// Atmosphere rim
const atmGeo=new THREE.SphereGeometry(1.03,64,64);

function ll3(lat,lon,r=1.003){
  const phi=(90-lat)*Math.PI/180, theta=(lon+180)*Math.PI/180;
  return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));
}

function drawBorderLine(coords, color=0x2a6040, opacity=0.7, r=1.003){
  if(coords.length<2) return;
  const pts=coords.map(([lon,lat])=>ll3(lat,lon,r));
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  const mat=new THREE.LineBasicMaterial({color,transparent:true,opacity});
  borderGroup.add(new THREE.Line(geo,mat));
}

async function loadBorders(){
  try{
    const res=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
    const topo=await res.json();
    const countries=topojson.feature(topo,'countries');
    // also load country mesh for borders between countries
    const borders=topojson.mesh(topo,'countries',(a,b)=>a!==b);

    // Draw internal country borders (between countries) as subtle lines
    drawTopoLines([borders],0x1e4d30,0.55);

    // Draw coastlines / outer land boundary
    const land=topojson.feature(topo,'land');
    if(land && land.features){
      land.features.forEach(f=>drawGeoFeature(f,0x1e5535,0.75));
    } else if(land && land.geometry){
      drawGeoFeature(land,0x1e5535,0.75);
    }

    // Draw country outlines (all countries including India from world-atlas)
    countries.features.forEach(f=>{
      drawGeoFeature(f,0x1a4a2a,0.5);
    });

    document.getElementById('loading-borders').style.display='none';
  } catch(e){
    // Fallback: just draw simplified coast outlines
    document.getElementById('loading-borders').textContent='';
    drawSimplifiedCoasts();
  }
}

function drawGeoFeature(feature,color,opacity){
  const geom=feature.geometry;
  if(!geom) return;
  if(geom.type==='Polygon'){
    geom.coordinates.forEach(ring=>drawBorderLine(ring,color,opacity));
  } else if(geom.type==='MultiPolygon'){
    geom.coordinates.forEach(poly=>poly.forEach(ring=>drawBorderLine(ring,color,opacity)));
  } else if(geom.type==='LineString'){
    drawBorderLine(geom.coordinates,color,opacity);
  } else if(geom.type==='MultiLineString'){
    geom.coordinates.forEach(line=>drawBorderLine(line,color,opacity));
  }
}

function drawTopoLines(meshes,color,opacity){
  meshes.forEach(m=>{
    if(!m || !m.geometry) return;
    drawGeoFeature(m,color,opacity);
  });
}

function drawSimplifiedCoasts(){
  // Very basic fallback continents if CDN fails
  document.getElementById('loading-borders').textContent='';
}

function addPoleMarker(lat, label){
  const pos=ll3(lat,0,1.018);

  const rMat=new THREE.MeshBasicMaterial({color:0x88ccff,transparent:true,opacity:0.8,side:THREE.DoubleSide});
  const ring=new THREE.Mesh(rGeo,rMat);
  ring.position.copy(pos);
  ring.lookAt(pos.clone().multiplyScalar(2));
  markerGroup.add(ring);

  // Dot at pole
  const dGeo=new THREE.SphereGeometry(0.006,8,8);
  const dMat=new THREE.MeshBasicMaterial({color:0xaaddff});
  const dot=new THREE.Mesh(dGeo,dMat);
  dot.position.copy(pos);
  markerGroup.add(dot);

  // Spike line from surface outward
  const spikePts=[pos.clone(),pos.clone().multiplyScalar(1.04)];
  const sGeo=new THREE.BufferGeometry().setFromPoints(spikePts);
  const sMat=new THREE.LineBasicMaterial({color:0x88ccff,transparent:true,opacity:0.6});
  markerGroup.add(new THREE.Line(sGeo,sMat));
}

function typeColor(t){return t==='combat'?0xcc1111:t==='accident'?0xff7300:0xff2222;}

const markerMeshes=[];

  const pos=ll3(ev.lat,ev.lon);
  const dotGeo=new THREE.SphereGeometry(0.013,12,12);
  const dotMat=new THREE.MeshBasicMaterial({color:typeColor(ev.type)});
  const dot=new THREE.Mesh(dotGeo,dotMat);
  dot.position.copy(pos);

  const rr=Math.max(0.022,Math.min(0.14,Math.log10(ev.yield_kt+1)*0.028));
  const ringGeo=new THREE.RingGeometry(rr*0.65,rr,48);
  const ringMat=new THREE.MeshBasicMaterial({color:typeColor(ev.type),transparent:true,opacity:0.28,side:THREE.DoubleSide});
  const ring=new THREE.Mesh(ringGeo,ringMat);
  ring.position.copy(pos);
  ring.lookAt(pos.clone().multiplyScalar(2));

  const grp=new THREE.Group();
  grp.add(dot,ring);
  grp.userData={event:ev,dot,ring};
  markerGroup.add(grp);
  markerMeshes.push(grp);
});

// ─── DRAG / ROTATE ────────────────────────────────────────────────────────────
let isDragging=false, prevMouse={x:0,y:0}, clickStart={x:0,y:0};

function rotateAll(dy,dx){
  globe.rotation.y+=dx; markerGroup.rotation.y+=dx; borderGroup.rotation.y+=dx;
  const nx=globe.rotation.x+dy;
  const clamped=Math.max(-1.2,Math.min(1.2,nx));
  globe.rotation.x=clamped; markerGroup.rotation.x=clamped; borderGroup.rotation.x=clamped;
}

renderer.domElement.addEventListener('mousedown',e=>{
  isDragging=true;
  prevMouse={x:e.clientX,y:e.clientY};
  clickStart={x:e.clientX,y:e.clientY};
});
renderer.domElement.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  const dx=e.clientX-prevMouse.x, dy=e.clientY-prevMouse.y;
  rotateAll(dy*0.003,dx*0.004);
  prevMouse={x:e.clientX,y:e.clientY};
});
renderer.domElement.addEventListener('mouseup',e=>{
  isDragging=false;
  const dx=Math.abs(e.clientX-clickStart.x), dy=Math.abs(e.clientY-clickStart.y);
  if(dx>5||dy>5)return;
  // Raycast for marker click
  const m2=new THREE.Vector2(
    (e.clientX/window.innerWidth)*2-1,
    -(e.clientY/window.innerHeight)*2+1
  );
  const rc=new THREE.Raycaster();
  rc.setFromCamera(m2,camera);
  const dots=markerMeshes.filter(m=>m.visible).map(m=>m.userData.dot);
  const hits=rc.intersectObjects(dots);
  if(hits.length){
    openCard(hits[0].object.parent.userData.event);
  }
});
renderer.domElement.addEventListener('mouseleave',()=>isDragging=false);
renderer.domElement.addEventListener('wheel',e=>{
  camera.position.z=Math.max(1.5,Math.min(5.5,camera.position.z+e.deltaY*0.006));
});

// ─── RENDER LOOP ──────────────────────────────────────────────────────────────
let t=0;
function animate(){
  requestAnimationFrame(animate);
  t+=0.016;
  // Auto-rotate only when not paused and not dragging
  if(!isDragging && !globePaused){
    const dr=0.0007;
    globe.rotation.y+=dr; markerGroup.rotation.y+=dr; borderGroup.rotation.y+=dr;
  }
  // Pulse markers
  markerMeshes.forEach(m=>{
    if(!m.visible)return;
    const s=1+0.22*Math.sin(t*2.5+m.userData.event.id*1.3);
    m.userData.dot.scale.setScalar(s);
  });
  renderer.render(scene,camera);
}
animate();

// ─── MARKERS VISIBILITY ──────────────────────────────────────────────────────
function updateMarkers(){
  let vis=0;
  markerMeshes.forEach(m=>{
    const ev=m.userData.event;
    const show=ev.year<=currentYear&&activeFilters[ev.type];
    m.visible=show; if(show)vis++;
  });
  document.getElementById('stat-visible').textContent=vis;
  document.getElementById('stat-total').textContent=EVENTS.length;
  document.getElementById('this-year-count').textContent=
    EVENTS.filter(e=>e.year===currentYear&&activeFilters[e.type]).length;
}

// ─── TIMELINE ────────────────────────────────────────────────────────────────
function onSlider(val){
  currentYear=parseInt(val);
  document.getElementById('year-display').textContent=currentYear;
  const pct=(currentYear-MIN_YEAR)/(MAX_YEAR-MIN_YEAR)*100;
  document.getElementById('slider-fill').style.width=pct+'%';
  updateMarkers();
}

function togglePlay(){
  isPlaying=!isPlaying;
  document.getElementById('play-btn').textContent=isPlaying?'⏸':'▶';
  if(isPlaying){
    playInterval=setInterval(()=>{
      if(currentYear>=MAX_YEAR){currentYear=MIN_YEAR;}
      currentYear++;
      document.getElementById('year-slider').value=currentYear;
      onSlider(currentYear);
    },280);
  } else { clearInterval(playInterval); }
}

function drawTicks(){
  const c=document.getElementById('tick-canvas');
  const ctx=c.getContext('2d');
  c.width=c.offsetWidth; c.height=32;
  for(let y=MIN_YEAR;y<=MAX_YEAR;y++){
    const count=EVENTS.filter(e=>e.year===y).length;
    if(!count)continue;
    const x=(y-MIN_YEAR)/(MAX_YEAR-MIN_YEAR)*c.width;
    const h=Math.min(16,3+count*4);
    ctx.fillStyle=`rgba(255,60,60,${Math.min(0.9,0.25+count*0.25)})`;
    ctx.fillRect(x-1.5,32-h,3,h);
  }
}
setTimeout(drawTicks,150);

function openCard(ev){
  selectedEvent=ev; isExpanded=false; chatHistory=[];
  globePaused=true;
  document.getElementById('globe-paused-badge').style.display='block';
  const card=document.getElementById('event-card');
  card.style.display='block'; card.classList.remove('expanded');
  document.getElementById('card-details').classList.remove('visible');
  document.getElementById('expand-icon').textContent='＋';
  document.getElementById('expand-label').textContent='Historical details & AI assistant';
  document.getElementById('chat-messages').innerHTML='';
  document.getElementById('intro-hint').style.opacity='0';
  document.getElementById('card-event-name').textContent=ev.name;
  const typeClass='badge-type-'+ev.type;
  const typeLabel=ev.type==='test'?'WEAPONS TEST':ev.type==='accident'?'ACCIDENT':'COMBAT USE';
  const yieldText=ev.yield_kt>=1000?(ev.yield_kt/1000).toFixed(1)+' MT':
                  ev.yield_kt>0?ev.yield_kt+' kT':'N/A';
  document.getElementById('card-meta').innerHTML=`
    <span class="meta-badge badge-year">${ev.year}</span>
    <span class="meta-badge badge-country">${ev.country}</span>
    <span class="meta-badge ${typeClass}">${typeLabel}</span>
    ${ev.yield_kt>0?`<span class="meta-badge badge-yield">⚡ ${yieldText}</span>`:''}
  `;
  document.getElementById('card-description').textContent=ev.desc;
}

function closeCard(){
  document.getElementById('event-card').style.display='none';
  selectedEvent=null;
  globePaused=false;
  document.getElementById('globe-paused-badge').style.display='none';
}
